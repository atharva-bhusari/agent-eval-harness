[project]
name = "eval-harness"
version = "0.1.0"
description = "Evaluation harness for LLM agents: execution-accuracy scoring, failure taxonomy, and A/B comparison across models and prompts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "litellm>=1.50",
    "duckdb>=1.1",
    "streamlit>=1.40",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # docs/specs are prose; don't reformat code samples inside them

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
