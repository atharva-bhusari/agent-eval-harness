name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Build Northwind DB
        run: uv run python -m eval_harness.db build
      - name: Unit + integration tests
        run: uv run pytest
      # Phase 8: 5-task smoke eval on a mocked LLM so CI never needs a paid key.
      # - name: Smoke eval
      #   run: make smoke
