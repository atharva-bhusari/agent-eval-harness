    name, and that product's revenue. Revenue is order-line unit price times quantity times (1 - discount).
  expected_sql: SELECT category_name, product_name, revenue FROM (SELECT c.category_name, p.product_name,
    SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue, RANK() OVER (PARTITION BY c.category_id
    ORDER BY SUM(od.unit_price * od.quantity * (1 - od.discount)) DESC) AS rk FROM order_details od JOIN
    products p USING (product_id) JOIN categories c USING (category_id) GROUP BY c.category_id, c.category_name,
    p.product_id, p.product_name) WHERE rk = 1
  expected_result:
